<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img">
<title>How TanStack Router fits together, with layout routes</title>
<desc>At build time the Vite plugin reads src/routes and generates routeTree.gen.ts. At runtime main.tsx creates the router, RouterProvider renders it, and the root route shows an Outlet. Plain routes index and about render there. Folders posts and admin each have a route.tsx layout that renders its children in its own Outlet.</desc>
<style>
  svg { font-family: system-ui, sans-serif; }
  .bg { fill: #ffffff; }
  .t, .ts, .th { fill: #2C2C2A; }
  .t, .th { font-size: 14px; } .ts { font-size: 12px; } .th { font-weight: 500; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: #888780; stroke-width: 0.5; stroke-dasharray: 4 4; }
  g > rect { stroke-width: 0.5; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
  .c-coral > rect { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1f1e1d; }
    .t, .ts, .th { fill: #D3D1C7; } .arr { stroke: #B4B2A9; }
    .c-purple > rect { fill: #3C3489; stroke: #AFA9EC; } .c-purple .th { fill: #CECBF6; } .c-purple .ts { fill: #AFA9EC; }
    .c-teal > rect { fill: #085041; stroke: #5DCAA5; } .c-teal .th { fill: #9FE1CB; } .c-teal .ts { fill: #5DCAA5; }
    .c-coral > rect { fill: #712B13; stroke: #F0997B; } .c-coral .th { fill: #F5C4B3; } .c-coral .ts { fill: #F0997B; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="770"/>
<rect class="zone" x="12" y="20" width="656" height="106" rx="12"/>
<text class="th" x="40" y="40">1. Build time (Vite)</text>
<g class="c-purple"><rect x="40" y="56" width="170" height="56" rx="8"/><text class="th" x="125" y="76" text-anchor="middle" dominant-baseline="central">vite.config.ts</text><text class="ts" x="125" y="94" text-anchor="middle" dominant-baseline="central">tanstackRouter() plugin</text></g>
<g class="c-purple"><rect x="255" y="56" width="170" height="56" rx="8"/><text class="th" x="340" y="76" text-anchor="middle" dominant-baseline="central">src/routes/*</text><text class="ts" x="340" y="94" text-anchor="middle" dominant-baseline="central">One file per route</text></g>
<g class="c-purple"><rect x="470" y="56" width="170" height="56" rx="8"/><text class="th" x="555" y="76" text-anchor="middle" dominant-baseline="central">routeTree.gen.ts</text><text class="ts" x="555" y="94" text-anchor="middle" dominant-baseline="central">Autogenerated route tree</text></g>
<line x1="210" y1="84" x2="253" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="84" x2="468" y2="84" class="arr" marker-end="url(#arrow)"/>
<path d="M555 112 V232 H472" class="arr" marker-end="url(#arrow)"/>
<rect class="zone" x="12" y="160" width="656" height="570" rx="12"/>
<text class="th" x="40" y="182">2. Runtime (in the browser)</text>
<g class="c-teal"><rect x="210" y="204" width="260" height="56" rx="8"/><text class="th" x="340" y="224" text-anchor="middle" dominant-baseline="central">main.tsx</text><text class="ts" x="340" y="242" text-anchor="middle" dominant-baseline="central">createRouter({ routeTree })</text></g>
<line x1="340" y1="260" x2="340" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="288" width="260" height="56" rx="8"/><text class="th" x="340" y="308" text-anchor="middle" dominant-baseline="central">RouterProvider</text><text class="ts" x="340" y="326" text-anchor="middle" dominant-baseline="central">Wraps the whole app</text></g>
<line x1="340" y1="344" x2="340" y2="370" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="372" width="260" height="56" rx="8"/><text class="th" x="340" y="392" text-anchor="middle" dominant-baseline="central">src/routes/__root.tsx</text><text class="ts" x="340" y="410" text-anchor="middle" dominant-baseline="central">Layout with &lt;Outlet /&gt;</text></g>
<path d="M340 428 V445 H72 V468" class="arr" marker-end="url(#arrow)"/>
<path d="M340 428 V445 H182 V468" class="arr" marker-end="url(#arrow)"/>
<path d="M340 428 V445 H341 V468" class="arr" marker-end="url(#arrow)"/>
<path d="M340 428 V445 H543 V468" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="22" y="470" width="100" height="56" rx="8"/><text class="th" x="72" y="490" text-anchor="middle" dominant-baseline="central">index.tsx</text><text class="ts" x="72" y="508" text-anchor="middle" dominant-baseline="central">'/' page</text></g>
<g class="c-coral"><rect x="132" y="470" width="100" height="56" rx="8"/><text class="th" x="182" y="490" text-anchor="middle" dominant-baseline="central">about.tsx</text><text class="ts" x="182" y="508" text-anchor="middle" dominant-baseline="central">'/about' page</text></g>
<text class="ts" x="22" y="580">A folder with a route.tsx is a</text>
<text class="ts" x="22" y="598">layout: it renders the matching</text>
<text class="ts" x="22" y="616">child in its own &lt;Outlet /&gt;</text>
<rect class="zone" x="246" y="470" width="190" height="248" rx="12"/>
<text class="th" x="266" y="490">posts/</text>
<g class="c-teal"><rect x="266" y="502" width="150" height="52" rx="8"/><text class="th" x="341" y="520" text-anchor="middle" dominant-baseline="central">route.tsx</text><text class="ts" x="341" y="538" text-anchor="middle" dominant-baseline="central">Layout + &lt;Outlet /&gt;</text></g>
<path d="M266 528 H256 V604 H264" class="arr" marker-end="url(#arrow)"/>
<path d="M266 528 H256 V680 H264" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="266" y="578" width="150" height="52" rx="8"/><text class="th" x="341" y="596" text-anchor="middle" dominant-baseline="central">index.tsx</text><text class="ts" x="341" y="614" text-anchor="middle" dominant-baseline="central">'/posts' page</text></g>
<g class="c-coral"><rect x="266" y="654" width="150" height="52" rx="8"/><text class="th" x="341" y="672" text-anchor="middle" dominant-baseline="central">$postId.tsx</text><text class="ts" x="341" y="690" text-anchor="middle" dominant-baseline="central">'/posts/{postId}'</text></g>
<rect class="zone" x="448" y="470" width="190" height="248" rx="12"/>
<text class="th" x="468" y="490">admin/</text>
<g class="c-teal"><rect x="468" y="502" width="150" height="52" rx="8"/><text class="th" x="543" y="520" text-anchor="middle" dominant-baseline="central">route.tsx</text><text class="ts" x="543" y="538" text-anchor="middle" dominant-baseline="central">Layout + &lt;Outlet /&gt;</text></g>
<path d="M468 528 H458 V604 H466" class="arr" marker-end="url(#arrow)"/>
<path d="M468 528 H458 V680 H466" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="468" y="578" width="150" height="52" rx="8"/><text class="th" x="543" y="596" text-anchor="middle" dominant-baseline="central">index.tsx</text><text class="ts" x="543" y="614" text-anchor="middle" dominant-baseline="central">'/admin' page</text></g>
<g class="c-coral"><rect x="468" y="654" width="150" height="52" rx="8"/><text class="th" x="543" y="672" text-anchor="middle" dominant-baseline="central">users.tsx</text><text class="ts" x="543" y="690" text-anchor="middle" dominant-baseline="central">'/admin/users' page</text></g>
</svg>
